<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e7e1d4">
<title>Routes</title>
<meta name="description" content="Draw roads and keep the city moving. A calm city-traffic puzzle you can play on your phone.">
<meta property="og:title" content="Routes: can you beat my score?">
<meta property="og:description" content="Draw roads, keep the city moving. Play free in your browser.">
<meta property="og:image" content="https://routes-game.onrender.com/og.png">
<meta property="og:url" content="https://routes-game.onrender.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3c424a;--soft:#8d9198;--card:#fffdf9;--bg:#e7e1d4;--sh:0 2px 12px rgba(70,58,35,.11),0 1px 2px rgba(70,58,35,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:Nunito,ui-rounded,-apple-system,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hud{position:fixed;left:0;right:0;display:flex;align-items:center;pointer-events:none}
#top{top:0;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px)}
.pill{pointer-events:auto;background:var(--card);border-radius:999px;box-shadow:var(--sh);height:48px;display:flex;align-items:center}
#clockP{padding:0 16px 0 5px;gap:8px}
#clock{width:38px;height:38px;transform:rotate(-90deg)}
#clock circle{fill:none;stroke-width:5}
#clock .trk{stroke:#eee9df}
#arc{stroke:var(--ink);stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:94.25}
#day{font-weight:900;font-size:15px;letter-spacing:1.2px;line-height:1}
#wk{font-size:11px;font-weight:700;color:var(--soft);line-height:1;margin-top:3px}
#scoreP{padding:0 16px 0 12px;gap:7px;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
#scoreP svg{width:22px;height:22px;color:var(--ink)}
.sp{flex:1}
.seg{padding:4px;gap:2px}
.seg button{width:38px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--soft);transition:background .25s,color .25s}
.seg button svg{width:17px;height:17px}
.seg button.on{background:var(--ink);color:#fff}
#tray{bottom:0;justify-content:center;gap:10px;padding:0 0 calc(env(safe-area-inset-bottom) + 18px)}
.tool{pointer-events:auto;position:relative;width:min(60px,calc((100vw - 76px)/6));height:min(60px,calc((100vw - 76px)/6));border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink);transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,opacity .25s}
.tool svg{width:52%;height:52%}
.tool.hide{display:none}
.tool.appear{animation:appear .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes appear{from{transform:scale(.2);opacity:0}}
.tool.on{transform:translateY(-5px);box-shadow:0 0 0 3px var(--ink),0 8px 18px rgba(70,58,35,.16)}
.tool b{position:absolute;right:-5px;bottom:-3px;min-width:26px;height:22px;padding:0 6px;border-radius:11px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--bg);font-variant-numeric:tabular-nums}
.tool.empty svg{opacity:.4}
.tool.empty b{background:#c9c3b7}
.bump{animation:bump .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{35%{transform:scale(1.22)}}
.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
#pausedTag{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 100px);transform:translate(-50%,-6px);background:rgba(60,66,74,.86);color:#fff;font-weight:800;font-size:12px;letter-spacing:.6px;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .3s,transform .4s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#pausedTag.show{opacity:1;transform:translate(-50%,0)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 104px);transform:translate(-50%,-10px) scale(.96);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .35s,transform .45s cubic-bezier(.2,1.4,.4,1);pointer-events:none;white-space:nowrap;box-shadow:var(--sh)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(231,225,212,.5);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .35s}
#modal.show{opacity:1;pointer-events:auto}
.sheet{background:var(--card);border-radius:30px;box-shadow:0 24px 70px rgba(70,58,35,.2);padding:30px 22px 24px;width:100%;max-width:340px;text-align:center;transform:translateY(24px) scale(.95);transition:transform .5s cubic-bezier(.2,1.35,.4,1)}
#modal.show .sheet{transform:none}
.kicker{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--soft);text-transform:uppercase}
h1{font-size:40px;font-weight:900;letter-spacing:-.5px;margin:6px 0 4px}
h2{font-size:26px;font-weight:900;margin:6px 0 2px}
.sub{font-size:15px;font-weight:600;color:var(--soft);line-height:1.45;margin-top:6px}
.logo{display:flex;gap:7px;justify-content:center;margin-bottom:8px}
.logo i{width:18px;height:18px;border-radius:6px;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-6px)}}
.tips{list-style:none;text-align:left;margin:18px 4px 4px;display:grid;gap:12px}
.tips li{display:flex;gap:12px;align-items:center;font-size:14px;font-weight:700;line-height:1.3}
.tips i{flex:none;width:40px;height:40px;border-radius:50%;background:#f4f0e7;display:grid;place-items:center}
.tips svg{width:22px;height:22px}
.primary{display:block;width:100%;background:var(--ink);color:#fff;border-radius:999px;height:56px;font-weight:800;font-size:18px;margin-top:22px;transition:transform .2s}
.primary:active,.ghost:active{transform:scale(.96)}
.ghost{display:block;width:100%;background:#f2eee5;border-radius:999px;height:50px;font-weight:800;font-size:16px;margin-top:10px;transition:transform .2s}
.best{font-size:13px;font-weight:700;color:var(--soft);margin-top:12px}
.gift{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#f4f0e7;border-radius:999px;padding:8px 16px 8px 10px;font-weight:800;font-size:15px}
.gift svg{width:24px;height:24px}
.choices{display:flex;gap:12px;margin-top:16px}
.choice{flex:1;background:#f4f0e7;border-radius:22px;padding:18px 6px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s,background .2s;animation:rise .5s cubic-bezier(.2,1.35,.4,1) both}
.choice:nth-child(2){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.choice:active{transform:scale(.94);background:#ebe5d8}
.choice .ico{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh);margin-bottom:6px}
.choice .ico svg{width:34px;height:34px}
.choice .amt{font-weight:900;font-size:24px;line-height:1}
.choice .lbl{font-size:13px;font-weight:700;color:var(--soft)}
.mini-col{position:fixed;right:calc(env(safe-area-inset-right) + 12px);top:calc(env(safe-area-inset-top) + 68px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.mini{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink);transition:background .25s,color .25s,opacity .25s,transform .2s}
.mini svg{width:20px;height:20px}.mini:active{transform:scale(.92)}
.mini.on{background:var(--ink);color:#fff}.mini.dim{opacity:.38}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.city{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#f4f0e7;border-radius:20px;padding:12px 14px;margin-top:10px;transition:transform .2s;animation:rise .45s cubic-bezier(.2,1.35,.4,1) both}
.city:active{transform:scale(.97)}
.city .sw{flex:none;width:46px;height:46px;border-radius:14px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.city .sw i{position:absolute;border-radius:50%}
.city b{display:block;font-size:16px;font-weight:800;color:var(--ink)}.city span{display:block;font-size:12.5px;font-weight:700;color:var(--soft);line-height:1.3}
.city .bs{margin-left:auto;font-size:13px;font-weight:800;color:var(--ink);text-align:right;white-space:nowrap}
.city.locked{opacity:.55}.city.locked .bs{font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.stat{background:#f4f0e7;border-radius:18px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:900;line-height:1.1}.stat span{font-size:12px;font-weight:700;color:var(--soft)}
.cb{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding:7px 2px;border-bottom:1px solid #f0ebe1}
.scroll{max-height:62vh;overflow:auto;margin:8px -6px 0;padding:0 6px;touch-action:pan-y}
#replay{display:block;margin:14px auto 0;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.link{background:none;font-weight:800;font-size:13px;color:var(--soft);margin-top:8px;padding:6px 10px}
.chal{background:linear-gradient(135deg,#fff4dc,#ffe9e4);border-radius:20px;padding:14px 14px 12px;margin:14px 0 2px;text-align:left;animation:rise .5s cubic-bezier(.2,1.35,.4,1) both}
.chal b{display:block;font-size:15px;font-weight:900}.chal span{display:block;font-size:13px;font-weight:700;color:#8a6d4a;margin-top:2px}
.chal .primary{margin-top:10px;height:46px;font-size:16px;background:#e9786b}
.lvl{display:flex;align-items:center;gap:10px;margin:12px 0 2px;text-align:left}
.lvl i{flex:none;width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:15px}
.lvl div{flex:1}.lvl b{font-size:13px;font-weight:800;display:flex;justify-content:space-between}.lvl b span{color:var(--soft)}
.bar{height:8px;border-radius:4px;background:#efeae0;overflow:hidden;margin-top:5px}.bar u{display:block;height:100%;background:linear-gradient(90deg,#5dbb8f,#5c9fd6);border-radius:4px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ach{background:#f4f0e7;border-radius:16px;padding:10px 6px;text-align:center}.ach em{display:block;font-style:normal;font-size:24px;line-height:1.1}.ach span{display:block;font-size:11px;font-weight:800;line-height:1.2;margin-top:4px}
.ach.off{opacity:.35;filter:grayscale(1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.chips span{background:#fff4dc;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;animation:rise .5s cubic-bezier(.2,1.35,.4,1) both}
.sharebox{word-break:break-all;width:100%;margin-top:10px;border:0;border-radius:14px;background:#f4f0e7;padding:10px 12px;font:600 12.5px/1.45 ui-monospace,Menlo,monospace;color:var(--ink);resize:none;user-select:text;-webkit-user-select:text}
#targetTag{white-space:nowrap;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translate(-50%,-6px);background:#fff4dc;color:#8a5a2a;font-weight:900;font-size:12.5px;padding:6px 14px;border-radius:999px;box-shadow:var(--sh);opacity:0;transition:opacity .3s,transform .4s cubic-bezier(.2,1.4,.4,1),background .4s;pointer-events:none}
#targetTag.show{opacity:1;transform:translate(-50%,0)}#targetTag.won{background:#dff3e8;color:#2f7d58}
.lb-tabs{display:flex;gap:6px;background:#f4f0e7;border-radius:999px;padding:4px;margin-top:12px}
.lb-tabs button{flex:1;height:36px;border-radius:999px;font-weight:800;font-size:14px;color:var(--soft)}.lb-tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.lb-list{margin-top:10px;text-align:left;min-height:120px}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;font-weight:800;font-size:14.5px}
.lb-row:nth-child(odd){background:#faf7f1}.lb-row.me{background:#fff4dc}
.lb-row .rk{width:30px;text-align:center;color:var(--soft);font-size:13px}.lb-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .sc{font-variant-numeric:tabular-nums}.lb-row .wk{width:44px;text-align:right;font-size:12px;color:var(--soft)}
.lb-msg{padding:26px 8px;text-align:center;color:var(--soft);font-weight:700;font-size:14px}
.name-in{width:100%;height:48px;border:2px solid #ece6da;border-radius:14px;padding:0 14px;font:800 17px Nunito,system-ui,sans-serif;color:var(--ink);background:#fff;margin-top:12px;user-select:text;-webkit-user-select:text}
.name-in:focus{outline:none;border-color:var(--ink)}
.join{background:#f4f0e7;border-radius:18px;padding:12px;margin-top:12px;text-align:left}.join b{font-size:14px}.join .row2{margin-top:8px}.join .name-in{margin-top:8px;height:44px}.join .primary{margin-top:0;height:44px;font-size:15px}
.shop{display:grid;gap:10px;margin-top:14px;text-align:left}
.item{display:flex;align-items:center;gap:12px;background:#f4f0e7;border-radius:20px;padding:10px 12px;animation:rise .45s cubic-bezier(.2,1.35,.4,1) both}
.item .ico{flex:none;width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh)}.item .ico svg{width:28px;height:28px}
.item div{flex:1;min-width:0}.item b{display:block;font-size:15px;font-weight:900}.item span{display:block;font-size:12px;font-weight:700;color:var(--soft);line-height:1.3}
.item button{flex:none;height:40px;padding:0 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:14px;transition:transform .15s,opacity .2s}
.item button:active{transform:scale(.94)}.item button:disabled{opacity:.35}
.wallet{display:inline-flex;align-items:center;gap:8px;background:#f4f0e7;border-radius:999px;padding:7px 14px 7px 10px;font-weight:900;font-size:15px;margin-top:10px}.wallet svg{width:22px;height:22px}
.big{font-size:84px;font-weight:900;line-height:1;margin:12px 0 0;letter-spacing:-2px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="top">
  <div class="pill" id="clockP">
    <svg id="clock" viewBox="0 0 40 40"><circle class="trk" cx="20" cy="20" r="15"/><circle id="arc" cx="20" cy="20" r="15"/></svg>
    <div><div id="day">MON</div><div id="wk">Week 1</div></div>
  </div>
  <div class="sp"></div>
  <div class="pill" id="scoreP"><svg viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="11" rx="4.5" fill="currentColor"/><rect x="13" y="8.8" width="5.5" height="6.4" rx="1.8" fill="#fff" opacity=".75"/></svg><span id="score">0</span></div>
  <div class="pill seg" id="seg">
    <button id="sPause" aria-label="Pause"><svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="3" width="4.2" height="14" rx="1.6"/><rect x="11.8" y="3" width="4.2" height="14" rx="1.6"/></svg></button>
    <button id="sPlay" class="on" aria-label="Play"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M5.5 3.6v12.8a1.1 1.1 0 0 0 1.7.9l10-6.4a1.1 1.1 0 0 0 0-1.8l-10-6.4a1.1 1.1 0 0 0-1.7.9z"/></svg></button>
    <button id="sFast" aria-label="Fast forward"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M1.5 4.6v10.8a.9.9 0 0 0 1.4.7L9.5 11v4.4a.9.9 0 0 0 1.4.7l7.4-5.4a.9.9 0 0 0 0-1.4L10.9 3.9a.9.9 0 0 0-1.4.7V9L2.9 3.9a.9.9 0 0 0-1.4.7z"/></svg></button>
  </div>
</div>

<div class="hud" id="tray">
  <button class="tool on" id="tRoad" aria-label="Road"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="5"><path d="M7 25c0-9 18-9 18-18"/></svg><b id="nRoad">0</b></button>
  <button class="tool" id="tBridge" aria-label="Bridge"><svg viewBox="0 0 32 32" fill="none" stroke-linecap="round"><path d="M4 26.5c3-2 5-2 8 0s5 2 8 0 5-2 8 0" stroke="#8ec3dc" stroke-width="2.4"/><path d="M5 15h22" stroke="currentColor" stroke-width="5"/><path d="M5 9.5h22M5 20.5h22" stroke="currentColor" stroke-width="2"/></svg><b id="nBridge">0</b></button>
  <button class="tool" id="tRound" aria-label="Roundabout"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="4"><circle cx="16" cy="16" r="7"/><path d="M16 3v3.5M16 25.5V29M3 16h3.5M25.5 16H29"/></svg><b id="nRound">0</b></button>
  <button class="tool hide" id="tMway" aria-label="Motorway"><svg viewBox="0 0 32 32" fill="none" stroke-linecap="round"><path d="M9 27v-7M23 27v-7" stroke="currentColor" stroke-width="2.4" opacity=".55"/><path d="M4 18C9 9 23 9 28 18" stroke="currentColor" stroke-width="6.5"/><path d="M4 18C9 9 23 9 28 18" stroke="#fff" stroke-width="1.2" stroke-dasharray="2.5 2.5"/></svg><b id="nMway">0</b></button>
  <button class="tool hide" id="tLight" aria-label="Traffic light"><svg viewBox="0 0 32 32"><rect x="10" y="3" width="12" height="26" rx="5" fill="currentColor"/><circle cx="16" cy="10" r="3" fill="#ef7f6f"/><circle cx="16" cy="16.5" r="3" fill="#f2c14e" opacity=".45"/><circle cx="16" cy="23" r="3" fill="#62c38f"/></svg><b id="nLight">0</b></button>
  <button class="tool" id="tErase" aria-label="Erase"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12.5 26 5.6 19.1a2 2 0 0 1 0-2.8L17 4.9a2 2 0 0 1 2.8 0l6.3 6.3a2 2 0 0 1 0 2.8L14 26z"/><path d="M10.5 13.5l8 8M12.5 26H27"/></svg></button>
</div>

<div class="mini-col">
  <button class="mini" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <button class="mini dim" id="bUndo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h9a5 5 0 0 1 0 10h-2"/></svg></button>
  <button class="mini" id="bShop" aria-label="Shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.2l2.1-7.5H6.4"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/></svg></button>
  <button class="mini" id="bHeat" aria-label="Traffic view"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M4 18c3-8 13-8 16 0" stroke="#5fc28e" stroke-width="3"/><path d="M8.2 11.4c2.4-2 5.2-2 7.6 0" stroke="#f2c14e" stroke-width="3"/><path d="M12 18l3-6" stroke="currentColor" stroke-width="2.6"/><circle cx="12" cy="18" r="1.8" fill="currentColor"/></svg></button>
</div>
<div id="targetTag"></div>
<div id="pausedTag">Paused · build freely</div>
<div id="toast"></div>
<div id="modal"></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');

const free=i=>!S.water[i]&&!S.road[i]&&!S.bld[i];

/* ---------- roads ---------- */
function crossOK(a,b){

  if(!S.water[a]&&!S.water[b]&&S.water[c1]&&S.water[c2])return false;
  if((S.bld[c1]&&S.bld[c1].door===c2)||(S.bld[c2]&&S.bld[c2].door===c1))return false;   // a diagonal driveway crosses this corner

function connect(a,b){

let strokeN=0,lastCell=-1;
function apply(c){

  if(S.road[c]){connect(lastCell,c);lastCell=c;return;}
  if(S.water[c]){
    if(lastCell<0||!S.road[lastCell]||!NB8[lastCell].includes(c)){lastCell=-1;return;}
    const dir=c-lastCell;
    if(S.water[lastCell]){
      const sp=S.spans[S.span[lastCell]];
      if(!sp||!crossOK(lastCell,c)){lastCell=-1;return;}
      sp.n++;S.span[c]=S.span[lastCell];
    }else{
      if(S.bridges<1){deny('tBridge');lastCell=-1;return;}
      S.bridges--;S.span[c]=S.spans.length;S.spans.push({n:1,dir});S.bridgesBuilt=(S.bridgesBuilt||0)+1;if(S.bridgesBuilt>=3)award('bridge3');
    }
    S.road[c]=1;S.born[c]=RT;changed=true;edits++;sfx.tick(strokeN++);
    connect(lastCell,c);lastCell=c;return;
  }
  if(S.pieces<1){deny('tRoad');lastCell=-1;return;}
  S.pieces--;stats.tiles++;S.road[c]=1;S.born[c]=RT;changed=true;edits++;sfx.tick(strokeN++);
  connect(lastCell,c);lastCell=c;
}
function cconns(i){const r=[...S.adj[i]];if(!S.water[i])for(const j of NB8[i])if(S.bld[j]&&S.bld[j].door===i)r.push(j);return r;}

  if(S.water[c]){const sp=S.spans[S.span[c]];if(sp){sp.n--;if(sp.n<=0)S.bridges++;}S.span[c]=-1;}
  else if(S.ramp[c])S.ramp[c]=0;   // ramp tiles came free with the motorway
  else S.pieces++;

// why a house can't face side j ('' = it can). Two houses may share the road tile in front of them.
function turnBlock(h,j){

let lastTurnMsg=-9;

/* ---------- routing ---------- */
const isJ=c=>S.road[c]&&(S.rb[c]||S.tl[c]||S.adj[c].size+S.mwAdj[c].size>=3);

const bldLink=(r,b)=>!S.water[r]&&!!S.bld[b]&&S.bld[b].door===r;

function fadeCar(c){c.dead=true;S.fades.push({c,t:RT});}

}

    if(ok)continue;

  for(let i=0;i<N;i++){
    if(sn.road[i]&&S.bld[i]){sn.road[i]=0;if(!S.water[i])sn.pieces++;}   // a building appeared there since: give the tile back
    if(S.road[i]&&!sn.road[i])S.ghosts.push({i,n:cconns(i),t:RT});
    if(sn.road[i]&&!S.road[i])S.born[i]=RT;
  }

  for(const a of S.adj)a.clear();

/* ---------- simulation ---------- */

}
function arriveCar(c){

  const back=route(d.i,b=>b===c.house);

const TLCYCLE=2.6;
const lightPhase=()=>Math.floor(S.t/TLCYCLE)%2;   // 0: east-west green, 1: north-south green
function greenFor(from,cell){const horiz=Y(from)===Y(cell)||(X(from)!==X(cell)&&Math.abs(X(from)-X(cell))>=Math.abs(Y(from)-Y(cell)));return (horiz?0:1)===lightPhase();}
function step(dt){

    let L=edgeCars.get(c.k);if(!L){L=[];edgeCars.set(c.k,L);}L.push(c);
    const cell=c.p<.5?a:b;if(isJ(cell))occ[cell]++;
  }

  const entered=new Set();
  for(const L of edgeCars.values()){
    for(let n=0;n<L.length;n++){

function expand(){
  const B=S.B;let ch=false;
  if(B.x1-B.x0<COLS){if((S.week%2===0&&B.x0>0)||B.x1>=COLS)B.x0--;else B.x1++;ch=true;}
  const th=Math.min(ROWS,Math.round((B.x1-B.x0)*ASPECT));
  for(let g=0;g<6&&B.y1-B.y0<th;g++){if(((B.y1-B.y0)%2===0&&B.y0>0)||B.y1>=ROWS)B.y0--;else B.y1++;ch=true;}
  return ch;
}
function unlockColor(){
  if(S.colors>=PAL.length)return '';
  const c=S.colors,d=spawnDest(c);
  if(!d){S.wantColor=true;return '';}

  return 'New colour: '+NAMES[c];
}
const MAXC=17;   // the world keeps growing until it is this wide
function growWorld(){
  const oc=COLS,orr=ROWS,on=N,nc=Math.min(MAXC,oc+2);
  if(nc===oc)return false;
  const nr=Math.max(orr+2,Math.round(nc*orr/oc)),ox=Math.floor((nc-oc)/2),oy=Math.floor((nr-orr)/2);
  if(nc*nr>1000)return false;
  const map=i=>i<0?-1:(((i/oc)|0)+oy)*nc+(i%oc)+ox;
  const city=cityById(S.city);
  // old state
  const O={water:S.water,road:S.road,rb:S.rb,tl:S.tl,ramp:S.ramp,born:S.born,rbBorn:S.rbBorn,tlBorn:S.tlBorn,span:S.span,heat:S.heat,adj:S.adj,mwAdj:S.mwAdj};
  setupGrid(nr,nc);
  const U8=()=>new Uint8Array(N),F32=()=>new Float32Array(N);
  for(const k of ['road','rb','tl','ramp'])S[k]=U8();
  for(const k of ['born','rbBorn','tlBorn','heat'])S[k]=F32();
  S.span=new Int16Array(N).fill(-1);S.water=U8();
  S.adj=Array.from({length:N},()=>new Set());S.mwAdj=Array.from({length:N},()=>new Set());
  const mapped=new Uint8Array(N);
  for(let i=0;i<on;i++){
    const j=map(i);mapped[j]=1;
    for(const k of ['water','road','rb','tl','ramp','born','rbBorn','tlBorn','heat','span'])S[k][j]=O[k][i];
    for(const t of O.adj[i])S.adj[j].add(map(t));
    for(const t of O.mwAdj[i])S.mwAdj[j].add(map(t));
  }
  // new land around the old world: rivers and coasts carry on, islands get a new shoreline
  const nearestOld=(x,y)=>{const cx=clamp(x,ox,ox+oc-1),cy=clamp(y,oy,oy+orr-1);return cy*nc+cx;};
  for(let i=0;i<N;i++){
    if(mapped[i])continue;
    const x=X(i),y=Y(i);
    if(city.gen==='island'){S.water[i]=(x===0||y===0||x===nc-1||y===nr-1)?1:0;continue;}
    const src=nearestOld(x,y),vertical=x>=ox&&x<ox+oc;    // above/below the old map: rivers flow on
    S.water[i]=S.water[src]&&rnd()<(vertical?.92:.45)?1:0;
  }
  if(city.gen==='island'){   // the old ring of sea becomes beach so the island grows
    for(let i=0;i<on;i++){const x=i%oc,y=(i/oc)|0;if((x===0||y===0||x===oc-1||y===orr-1)){const j=map(i);if(S.water[j]&&!S.road[j])S.water[j]=0;}}
  }else if(city.gen==='lakes'&&rnd()<.6){
    const side=rnd()<.5;const cx=side?ri(0,ox):ri(nc-ox-1,nc-1),cy=ri(1,nr-2);
    for(let y=0;y<nr;y++)for(let x=0;x<nc;x++){const i=y*nc+x;if(mapped[i])continue;const dx=x-cx,dy=y-cy;if(dx*dx+dy*dy<=1.6)S.water[i]=1;}
  }
  // buildings, cars, motorways, trees, replay frames
  S.bld=new Array(N).fill(null);
  for(const b of [...S.houses,...S.dests]){b.i=map(b.i);b.door=map(b.door);S.bld[b.i]=b;}
  for(const c of S.cars){c.path=c.path.map(map);c.lx=undefined;}
  for(const m of S.mw){m.a=map(m.a);m.b=map(m.b);}
  for(const t of S.trees)t.i=map(t.i);
  for(let k=0;k<4;k++){const i=ri(0,N-1);if(!mapped[i]&&!S.water[i])S.trees.push({i,dx:(rnd()-.5)*.5,dy:(rnd()-.5)*.5,r:.09+rnd()*.07,a:1});}
  for(const f of S.frames){f.r=f.r.map(map);f.e=f.e.map(map);f.m=f.m.map(([a,b])=>[map(a),map(b)]);f.b=f.b.map(([i,c,d])=>[map(i),c,d]);f.B={x0:f.B.x0+ox,x1:f.B.x1+ox,y0:f.B.y0+oy,y1:f.B.y1+oy};}
  S.B={x0:S.B.x0+ox,x1:S.B.x1+ox,y0:S.B.y0+oy,y1:S.B.y1+oy};S.DB={x0:S.DB.x0+ox,x1:S.DB.x1+ox,y0:S.DB.y0+oy,y1:S.DB.y1+oy};
  camX+=ox;camY+=oy;anc.wx+=ox;anc.wy+=oy;
  S.fades=[];S.ghosts=[];S.dwGhost=[];S.patches=null;undoStack=[];syncUndo();
  edgeCars=new Map();occ=new Int16Array(N);
  return true;
}

      SHOP.map((it,i)=>'<div class="item" style="animation-delay:'+(i*.05)+'s'+(focus===it.k?';box-shadow:0 0 0 2.5px var(--ink)':'')+'"><span class="ico">'+ICON[it.k]+'</span><div><b>'+it.name+(shopHas(it.k)?' <span style="display:inline;font-size:13px">×'+shopHas(it.k)+'</span>':'')+'</b><span>'+it.desc+'</span></div>'+

let repRAF=0;
function playReplay(){
  const c=$('replay');if(!c||!c.getContext)return;const g=c.getContext('2d'),F=S.frames,cell=c.width/COLS;if(!F.length)return;
  const water=S.water.slice(),pal={land:LAND,water:WATER,road:ROAD,out:OUTC};
  cancelAnimationFrame(repRAF);const t0=performance.now(),dur=Math.min(6000,Math.max(2500,F.length*90));
  const draw=now=>{
    const k=clamp((now-t0)/dur,0,1),f=F[Math.min(F.length-1,Math.floor(easeOut(k)*F.length))];
    g.setTransform(1,0,0,1,0,0);g.fillStyle=pal.out;g.fillRect(0,0,c.width,c.height);
    g.setTransform(cell,0,0,cell,0,0);
    g.fillStyle=pal.land;g.fillRect(f.B.x0,f.B.y0,f.B.x1-f.B.x0,f.B.y1-f.B.y0);
    g.fillStyle=pal.water;for(let i=0;i<N;i++)if(water[i])g.fillRect(X(i)-.02,Y(i)-.02,1.04,1.04);
    g.strokeStyle=pal.road;g.lineWidth=.34;g.lineCap='round';g.lineJoin='round';g.beginPath();
    for(const i of f.r){g.moveTo(X(i)+.5,Y(i)+.5);g.lineTo(X(i)+.501,Y(i)+.5);}
    for(let q=0;q+1<f.e.length;q+=2){const a=f.e[q],b=f.e[q+1];g.moveTo(X(a)+.5,Y(a)+.5);g.lineTo(X(b)+.5,Y(b)+.5);}
    g.stroke();
    g.strokeStyle='#454b53';g.lineWidth=.42;g.beginPath();for(const [a,b] of f.m){g.moveTo(X(a)+.5,Y(a)+.5);g.lineTo(X(b)+.5,Y(b)+.5);}g.stroke();
    for(const [i,col,d] of f.b){const s=d?.8:.5;g.fillStyle=PAL[col].c;g.beginPath();g.roundRect?g.roundRect(X(i)+.5-s/2,Y(i)+.5-s/2,s,s,.14):g.rect(X(i)+.5-s/2,Y(i)+.5-s/2,s,s);g.fill();}
    g.setTransform(1,0,0,1,0,0);g.fillStyle='rgba(60,66,74,.75)';g.font='800 '+Math.round(c.width/14)+'px Nunito,system-ui,sans-serif';
    g.fillText('Week '+f.w+' · '+f.s,c.width*.05,c.height-c.width*.05);
    if(k<1&&$('replay')===c)repRAF=requestAnimationFrame(draw);
  };
  repRAF=requestAnimationFrame(draw);
}

/* ---------- camera ---------- */
let W=0,H=0,dpr=1,topH=70,botH=100,VCX=0,VCY=0;
let Z=60,camX=0,camY=0,camMode='idle',holdT=0,anc={wx:0,wy:0,sx:0,sy:0,z:1,t:0};
const fing={x:0,y:0};
function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,3);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const t=$('top').getBoundingClientRect(),b=$('tray').getBoundingClientRect();
  topH=(t.bottom||70)+8;botH=H-(b.top||H-100)+6;
  VCX=W/2;VCY=H/2;
  if(S)snapCam();
}
function viewOf(B){
  const bw=B.x1-B.x0+.7,bh=B.y1-B.y0+.5,aH=H-topH-botH;
  const z=Math.min(W/bw,aH/bh)*.96,acy=topH+aH/2;
  return [z,(B.x0+B.x1)/2,(B.y0+B.y1)/2-(acy-H/2)/z];
}
function baseView(){return viewOf(S.DB);}
function snapCam(){const v=baseView();Z=v[0];camX=v[1];camY=v[2];camMode='idle';}
function clampCam(){
  const B=S.DB,bv=baseView();
  let lo=B.x0-.5+VCX/Z,hi=B.x1+.5-(W-VCX)/Z;camX=lo>hi?bv[1]:clamp(camX,lo,hi);
  lo=B.y0-.4+(VCY-topH)/Z;hi=B.y1+.4-(H-botH-VCY)/Z;camY=lo>hi?bv[2]:clamp(camY,lo,hi);
}
function updateCam(dt){
  for(const k of ['x0','y0','x1','y1'])S.DB[k]=damp(S.DB[k],S.B[k],2.4,dt);
  const [bz,bx,by]=baseView();
  if(camMode==='draw'){
    Z=damp(Z,anc.z,7,dt);
    if(armed&&RT-anc.t>.3){
      const m=60,sp=6*dt;let px=0,py=0;
      if(fing.x<m)px=-(1-fing.x/m);else if(fing.x>W-m)px=1-(W-fing.x)/m;
      if(fing.y<topH+m)py=-clamp((topH+m-fing.y)/m,0,1);else if(fing.y>H-botH-m)py=clamp((fing.y-(H-botH-m))/m,0,1);
      anc.wx+=px*sp;anc.wy+=py*sp;
    }
    camX=anc.wx-(anc.sx-VCX)/Z;camY=anc.wy-(anc.sy-VCY)/Z;clampCam();
    anc.wx=camX+(anc.sx-VCX)/Z;anc.wy=camY+(anc.sy-VCY)/Z;
    if(drawing&&armed)stroke();
  }else if(camMode==='pinch'){clampCam();}
  else if(camMode==='hold'){
    holdT-=dt;
    // something needs attention off-screen: come back out sooner
    for(const d of S.dests)if(d.stress>.05){const sx=(X(d.i)+.5-camX)*Z+VCX,sy=(Y(d.i)+.5-camY)*Z+VCY;if(sx<0||sx>W||sy<topH||sy>H-botH){holdT=Math.min(holdT,.4);break;}}
    if(holdT<=0)camMode='idle';
    clampCam();
  }
  else if(camMode==='over'&&S.overD){const d=S.overD;Z=damp(Z,bz*1.6,1.8,dt);camX=damp(camX,X(d.i)+.5,1.8,dt);camY=damp(camY,Y(d.i)+.5,1.8,dt);}
  else{Z=damp(Z,bz,3.5,dt);camX=damp(camX,bx,3.5,dt);camY=damp(camY,by,3.5,dt);}
}

/* ---------- input ---------- */
const ptrs=new Map();let mwDrag=null,pinch=null,drawing=false,armed=false,pend=null,lastCur=-1,prevCur=-1,skipB=-1;
const toWorld=(sx,sy)=>[camX+(sx-VCX)/Z,camY+(sy-VCY)/Z];
const cellAtW=(wx,wy)=>{const x=Math.floor(wx),y=Math.floor(wy);return x<0||y<0||x>=COLS||y>=ROWS?-1:y*COLS+x;};
const blocked=()=>!S||S.reward||S.over||modalOpen;
const HOLD=2.2;
function zoomOut(){if(camMode==='hold'||camMode==='draw'){camMode='idle';tone(LOWP[1]*2,.18,.02,0,'triangle');}}
function endStroke(){
  if(drawing){drawing=false;if(camMode==='draw'){camMode='hold';holdT=HOLD;}}
  armed=false;pend=null;lastCell=-1;lastCur=-1;prevCur=-1;skipB=-1;}
function walk4(from,to){let c=from;for(let g=0;g<40&&c!==to;g++){const dx=X(to)-X(c),dy=Y(to)-Y(c);c=Math.abs(dx)>=Math.abs(dy)?c+Math.sign(dx):c+Math.sign(dy)*COLS;apply(c);}}
function stroke(){
  if(blocked())return;
  const [wx,wy]=toWorld(fing.x,fing.y);
  if(tool==='erase'){
    for(const m of S.mw.slice()){const ax=X(m.a)+.5,ay=Y(m.a)+.5,bx=X(m.b)+.5,by=Y(m.b)+.5,vx=bx-ax,vy=by-ay,t=clamp(((wx-ax)*vx+(wy-ay)*vy)/(vx*vx+vy*vy),0,1);if(t>.15&&t<.85&&Math.hypot(ax+vx*t-wx,ay+vy*t-wy)<.3){removeMw(m);after();}}
    const c=cellAtW(wx,wy);if(c<0||c===lastCur)return;
    if(lastCur<0)apply(c);else walk4(lastCur,c);
    lastCur=c;after();return;
  }
  if(lastCur<0){const c=cellAtW(wx,wy);if(c>=0&&inB(c)){lastCur=c;apply(c);after();}return;}
  for(let g=0;g<24;g++){
    const dx=wx-(X(lastCur)+.5),dy=wy-(Y(lastCur)+.5),ax=Math.abs(dx),ay=Math.abs(dy);
    if(Math.max(ax,ay)<.62)break;
    let sx=0,sy=0;
    if(Math.min(ax,ay)/Math.max(ax,ay)>.55){sx=Math.sign(dx);sy=Math.sign(dy);}
    else if(ax>ay)sx=Math.sign(dx);else sy=Math.sign(dy);
    const nx=X(lastCur)+sx,ny=Y(lastCur)+sy;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS)break;
    let c=ny*COLS+nx;
    if(sx&&sy&&((S.bld[c]&&S.bld[c].door!==lastCur)||(S.bld[lastCur]&&S.bld[lastCur].door!==c)||!crossOK(lastCur,c)))c=ax>ay?lastCur+sx:lastCur+sy*COLS;
    const fd=j=>Math.hypot(wx-(X(j)+.5),wy-(Y(j)+.5));
    if(S.bld[lastCur]){
      if(prevCur<0&&S.bld[lastCur].kind==='h'){
        const h=S.bld[lastCur];
        if(Math.max(ax,ay)<.72)break;
        // the drag's direction picks one of the 8 tiles around the house; if that one is blocked, try its neighbours
        const k=Math.round(Math.atan2(dy,dx)/(Math.PI/4)),cands=[k,k+(Math.atan2(dy,dx)/(Math.PI/4)>k?1:-1),k-(Math.atan2(dy,dx)/(Math.PI/4)>k?1:-1)];
        let t=-1,why='';
        for(const kk of cands){const j=ringCell(lastCur,kk);if(j<0){why=why||'edge';continue;}if(j===h.door){t=j;break;}const b=turnBlock(h,j);if(!b){t=j;break;}why=why||b;}
        if(t<0)refuseTurn(h,why||'edge');else if(t!==h.door)turnHouse(h,t);
      }
      const dr=S.bld[lastCur].door;if(dr<0)break;
      if(dr===prevCur&&fd(dr)>=fd(lastCur)){
        if(cellAtW(wx,wy)===lastCur)break; // finger resting on the building: stay connected
        skipB=lastCur;prevCur=lastCur;lastCur=dr;lastCell=S.road[dr]?dr:-1;continue; // back out and go around
      }
      c=dr;
    }else if(S.bld[c]&&(S.bld[c].door!==lastCur||c===skipB)){
      // never drive into a building from the wrong side: step around it
      let bestC=-1,bd=fd(lastCur)-.05;
      for(const j of NB8[lastCur]){if(S.bld[j]||!inB(j)||(isDiag(lastCur,j)&&!crossOK(lastCur,j)))continue;const v=fd(j);if(v<bd){bd=v;bestC=j;}}
      if(bestC<0)break;c=bestC;
    }
    if(!inB(c)||c===prevCur&&!S.road[c])break;
    if(!S.bld[c]&&c!==(skipB>=0&&S.bld[skipB]?S.bld[skipB].door:-1))skipB=-1;
    apply(c);prevCur=lastCur;lastCur=c;
  }
  after();
}
cv.addEventListener('pointerdown',e=>{
  audio();if(blocked())return;
  if(ptrs.size===0)beginEdit();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    endStroke();camMode='pinch';
    const [a,b]=[...ptrs.values()],[wx,wy]=toWorld((a.x+b.x)/2,(a.y+b.y)/2);
    pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:Z,wx,wy};return;
  }
  if(ptrs.size>2)return;
  const [wx,wy]=toWorld(e.clientX,e.clientY),c=cellAtW(wx,wy);
  if(tool==='round'){placeRound(c);endEdit();return;}
  if(tool==='light'){placeLight(c);endEdit();return;}
  if(tool==='mway'){mwDrag={a:c,b:c,ok:false};return;}
  const bz=baseView()[0];
  const zoomed=camMode==='hold'||camMode==='draw'||Z>bz*1.05;
  drawing=true;armed=false;strokeN=0;lastCell=-1;lastCur=-1;prevCur=-1;skipB=-1;
  pend={c,sx:e.clientX,sy:e.clientY,zoomed};
  anc={wx,wy,sx:e.clientX,sy:e.clientY,z:zoomed?Math.max(Z,bz*1.2):Math.max(bz*1.2,Math.min(bz*1.6,84)),t:RT};
  fing.x=e.clientX;fing.y=e.clientY;camMode='draw';
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(camMode==='pinch'&&pinch&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()],bz=baseView()[0];
    Z=clamp(pinch.z0*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d0,bz,bz*2.6);
    camX=pinch.wx-((a.x+b.x)/2-VCX)/Z;camY=pinch.wy-((a.y+b.y)/2-VCY)/Z;clampCam();return;
  }
  if(mwDrag){const [wx,wy]=toWorld(e.clientX,e.clientY);mwDrag.b=cellAtW(wx,wy);mwDrag.ok=mwCheck(mwDrag.a,mwDrag.b);return;}
  if(drawing){
    fing.x=e.clientX;fing.y=e.clientY;
    if(!armed){
      if(Math.hypot(e.clientX-pend.sx,e.clientY-pend.sy)<9)return;
      armed=true;anc.t=RT;const c=pend.c;
      if(c>=0&&inB(c)){lastCur=c;apply(c);after();}
    }
    stroke();
  }
});
function up(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(camMode==='pinch'){if(ptrs.size<2){pinch=null;camMode='hold';holdT=HOLD+1;}return;}
  if(mwDrag){const m=mwDrag;mwDrag=null;if(ptrs.size===0&&m.b!==m.a)placeMw(m.a,m.b);endEdit();return;}
  if(ptrs.size===0&&drawing&&!armed&&pend){
    // a tap (no drag)
    const c=pend.c;
    if(tool==='road'&&c>=0&&S.bld[c]&&S.bld[c].kind==='h'){tapTurn(S.bld[c]);after();}
    else if(tool==='erase'&&c>=0&&S.road[c]){apply(c);after();}
    else if(tool==='erase'){fing.x=pend.sx;fing.y=pend.sy;armed=true;stroke();}
    else if(pend.zoomed&&(c<0||!inB(c)||(!S.road[c]&&!S.bld[c])))zoomOut();
    else if(!pend.zoomed&&c>=0&&inB(c)){lastCur=c;apply(c);after();}
  }
  if(ptrs.size===0){endStroke();endEdit();}
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* ---------- drawing ---------- */
function rrp(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function rr(x,y,w,h,r){ctx.beginPath();rrp(x,y,w,h,r);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);}
function waterPath(inf){
  const BIG=60;ctx.beginPath();
  for(let i=0;i<N;i++){
    if(!S.water[i])continue;
    const x0=X(i),y0=Y(i),p=.04-inf,w=1-2*p;
    rrp(x0+p,y0+p,w,w,.42+inf);
    const R=x0<COLS-1&&S.water[i+1],D=y0<ROWS-1&&S.water[i+COLS];
    if(R)ctx.rect(x0+.5,y0+p,1,w);
    if(D)ctx.rect(x0+p,y0+.5,w,1);
    if(R&&D&&S.water[i+COLS+1])ctx.rect(x0+.5,y0+.5,1,1);

  for(let k=0;k<6;k++){const e=k*.09;ctx.beginPath();ctx.rect(vx0,vy0,vw,vh);rrp(B.x0-e,B.y0-e,B.x1-B.x0+2*e,B.y1-B.y0+2*e,.3+e);ctx.fill('evenodd');}

  drawRoads();
  if(drawing&&lastCur>=0&&tool!=='round'&&tool!=='light'&&tool!=='mway'){
    ctx.strokeStyle=tool==='erase'?'rgba(233,120,107,.85)':'rgba(255,255,255,.95)';ctx.lineWidth=.05;
    rr(X(lastCur)+.06,Y(lastCur)+.06,.88,.88,.24);ctx.stroke();
  }
  const onMw=c=>isMw(c.path[c.i],c.path[c.i+1]);
  S.fades=S.fades.filter(f=>RT-f.t<.35);
  for(const c of S.cars)if(!onMw(c))drawCar(c,dt,1);
  for(const f of S.fades)drawCar(f.c,dt,1-(RT-f.t)/.35);
  for(const h of S.houses)drawHouse(h,dt);
  for(const d of S.dests)drawDest(d);
  drawMotorways();
  for(const c of S.cars)if(onMw(c))drawCar(c,dt,1);
  // traffic view
  if(heatOn){
    ctx.lineCap='round';ctx.lineJoin='round';
    for(let i=0;i<N;i++)if(S.road[i]){
      const h=clamp(S.heat[i]/2.2,0,1),col=h<.5?'rgba('+Math.round(95+h*2*147)+','+Math.round(194-h*2*1)+','+Math.round(142-h*2*64)+',.95)':'rgba('+Math.round(242-(h-.5)*2*4)+','+Math.round(193-(h-.5)*2*71)+','+Math.round(78+(h-.5)*2*30)+',.95)';
      ctx.strokeStyle=col;ctx.lineWidth=RW*.5;ctx.beginPath();roadPath(i,cconns(i));ctx.stroke();
    }
    for(const m of S.mw){const h=Math.max(S.heat[m.a],S.heat[m.b])/2.2;ctx.strokeStyle=h>.5?'#ef7b6c':h>.2?'#f2c14e':'#5fc28e';ctx.lineWidth=RW*.45;ctx.beginPath();ctx.moveTo(X(m.a)+.5,Y(m.a)+.5);ctx.lineTo(X(m.b)+.5,Y(m.b)+.5);ctx.stroke();}
  }
  // evening light: the town dims, windows and headlights come on
  nightNow=damp(nightNow,S.over?0:nightAmt(),3,dt);
  if(nightNow>.01){
    ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=nightNow*.85;ctx.fillStyle=NIGHT;ctx.fillRect(vx0,vy0,vw,vh);ctx.restore();
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const b of [...S.houses,...S.dests]){                 // warm glow around lit buildings
      const x=X(b.i)+.5,y=Y(b.i)+.5,s=pop((RT-b.born)/.6);if(s<.2)continue;
      const g=ctx.createRadialGradient(x,y,0,x,y,(b.kind==='d'?.9:.6)*s);g.addColorStop(0,'rgba(255,190,110,'+(.32*nightNow)+')');g.addColorStop(1,'rgba(255,190,110,0)');
      ctx.fillStyle=g;circ(x,y,(b.kind==='d'?.9:.6)*s);ctx.fill();
    }
    for(const c of S.cars){                                     // headlight beams
      if(c.lx===undefined)continue;
      const a=c.ang||0,fx=c.lx+Math.cos(a)*.14,fy=c.ly+Math.sin(a)*.14,g=ctx.createRadialGradient(fx,fy,0,fx,fy,.62);
      g.addColorStop(0,'rgba(255,236,180,'+(.45*nightNow)+')');g.addColorStop(1,'rgba(255,236,180,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(fx,fy);ctx.arc(fx,fy,.62,a-.42,a+.42);ctx.closePath();ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha=nightNow;
    for(const b of [...S.houses,...S.dests]){
      const x=X(b.i)+.5,y=Y(b.i)+.5,s=pop((RT-b.born)/.6);if(s<.2)continue;
      ctx.fillStyle='#ffe2a3';
      if(b.kind==='h'){rr(x-.06,y-.06,.12,.12,.03);ctx.fill();}
      else{for(const [dx,dy] of [[-.24,-.16],[-.24,0],[-.24,.16]]){const a=b.ang||0,cx2=x+dx*Math.cos(a)-dy*Math.sin(a),cy2=y+dx*Math.sin(a)+dy*Math.cos(a);rr(cx2-.04,cy2-.04,.08,.08,.02);ctx.fill();}}
    }
    ctx.globalAlpha=1;
  }
  for(const d of S.dests)drawPins(d,dt);
  // soft vignette
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!vig||vig.w!==W||vig.h!==H){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.42,W/2,H/2,Math.hypot(W,H)*.6);g.addColorStop(0,'rgba(120,100,60,0)');g.addColorStop(1,'rgba(120,100,60,.12)');vig={w:W,h:H,g};}
  ctx.fillStyle=vig.g;ctx.fillRect(0,0,W,H);
  drawBits(dt);
}

/* ---------- HUD ---------- */
let hud={};
function setText(id,v){if(hud[id]===v)return 0;const up=typeof v==='number'&&typeof hud[id]==='number'&&v>hud[id];hud[id]=v;$(id).textContent=v;return up?2:1;}
function syncHud(force){
  if(force)hud={};
  {const tg=S.target&&!modalOpen&&!S.over,el=$('targetTag');
   const txt=!S.target?'':S.beaten?'🏁 Beaten! +'+(S.score-S.target):'🏁 Beat '+S.target+' · '+(S.target-S.score+1)+' to go';
   if(hud.tgt!==txt+tg){hud.tgt=txt+tg;el.textContent=txt;el.classList.toggle('show',!!tg);el.classList.toggle('won',!!S.beaten);}}
  if(setText('score',S.score)===2)anim('scoreP','bump');
  setText('day',DAYS[Math.min(6,Math.floor(S.weekT/(WEEK/7)))]);
  setText('wk','Week '+S.week);
  const off=+(94.25*(1-S.weekT/WEEK)).toFixed(1);
  if(hud.arc!==off){hud.arc=off;$('arc').style.strokeDashoffset=off;}
  for(const [id,v,t,k] of [['nRoad',S.pieces,'tRoad'],['nBridge',S.bridges,'tBridge'],['nRound',S.rounds,'tRound','round'],['nMway',S.mways,'tMway','mway'],['nLight',S.lights,'tLight','light']]){
    const r=setText(id,v);if(r===2&&!force)anim(id,'bump');
    if(r)$(t).classList.toggle('empty',v<1);
    if(k){
      if(v>0||(k==='round'&&S.rb.some(x=>x))||(k==='mway'&&S.mw.length>0)||(k==='light'&&S.tl.some(x=>x)))S.seen[k]=1;
      const show=!!S.seen[k],el=$(t),was=!el.classList.contains('hide');
      if(show!==was){el.classList.toggle('hide',!show);if(show&&!force)anim(t,'appear');}
    }
  }
}

/* ---------- loop ---------- */
let prevT=0,acc=0;
function loop(now){
  const dt=Math.min(.05,(now-prevT)/1000||0);prevT=now;RT+=dt;
  ts=damp(ts,S.over?0:(drawing&&armed?.6:1),S.over?1.4:6,dt);
  if(!S.paused&&!S.reward&&!modalOpen&&ts>.01){
    acc+=dt*S.speed*ts;let n=0;
    while(acc>=1/60&&n<8){step(1/60);acc-=1/60;n++;}
    if(n===8)acc=0;
  }else acc=0;
  updateCam(dt);render(dt);syncHud();
  requestAnimationFrame(loop);
}
